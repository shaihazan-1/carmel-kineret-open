<!DOCTYPE html>
<html lang="he" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0">
<title>ההרשמה למרוץ שביל כרמל-כנרת</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Frank+Ruhl+Libre:wght@500;700;900&family=Rubik:wght@400;500;700;900&display=swap" rel="stylesheet">
<style>
  :root{
    --green:#3d9a5c;
    --green-deep:#1f6b3f;
    --green-dark:#123a26;
    --blue:#7ec8e3;
    --blue-deep:#2f8fb8;
    --blue-dark:#155578;
    --sand:#d68a3c;
    --sand-light:#f0c896;
    --ink:#16211a;
    --paper:#fbfaf5;
    --glass:rgba(255,255,255,.85);
  }
  *{box-sizing:border-box; margin:0; padding:0;}
  html,body{height:100%;}
  body{
    font-family:'Rubik', sans-serif;
    color:var(--ink);
    min-height:100vh;
    display:flex;
    align-items:center;
    justify-content:center;
    position:relative;
    overflow-x:hidden;
    background:var(--paper);
  }

  /* full scene: mountain (green) up top, lake (blue) below, echoing the logo's route from Carmel to Kinneret */
  .scene{
    position:fixed; inset:0; z-index:0;
    background:
      linear-gradient(180deg,
        #0f3d2c 0%,
        #1f6b3f 22%,
        #3d9a5c 40%,
        #cfe8d6 48%,
        #d9eef2 52%,
        #7ec8e3 66%,
        #2f8fb8 84%,
        #124a63 100%);
  }
  .scene svg{ position:absolute; inset:0; width:100%; height:100%; }

  .grain{
    position:fixed; inset:0; z-index:1; pointer-events:none;
    background-image: radial-gradient(rgba(255,255,255,.05) 1px, transparent 1px);
    background-size: 3px 3px;
    opacity:.5;
  }

  .stage{
    position:relative; z-index:2;
    width:100%;
    max-width:520px;
    padding:26px;
  }

  .logo-badge{
    width:min(46vw, 178px);
    margin:0 auto 4px;
    display:block;
    filter: drop-shadow(0 10px 24px rgba(0,0,0,.28));
  }

  .card{
    position:relative;
    background:var(--glass);
    backdrop-filter: blur(14px) saturate(140%);
    -webkit-backdrop-filter: blur(14px) saturate(140%);
    border-radius:26px;
    padding:30px 26px 26px;
    text-align:center;
    border:1px solid rgba(255,255,255,.6);
    box-shadow: 0 30px 60px rgba(10,30,20,.35), inset 0 1px 0 rgba(255,255,255,.8);
  }

  .eyebrow{
    font-size:12px;
    letter-spacing:.32em;
    color:var(--green-deep);
    text-transform:uppercase;
    font-weight:700;
    margin-bottom:8px;
  }

  h1{
    font-family:'Frank Ruhl Libre', serif;
    font-weight:900;
    font-size:clamp(20px, 5vw, 27px);
    line-height:1.4;
    color:var(--green-dark);
    margin-bottom:26px;
  }

  .clock{
    display:flex;
    justify-content:center;
    gap:clamp(7px,2vw,13px);
    margin-bottom:22px;
  }
  .unit{
    background:linear-gradient(160deg, #ffffff, #eef6ef);
    border-radius:16px;
    padding:13px 6px 11px;
    flex:1 1 0;
    min-width:0;
    box-shadow: 0 8px 20px rgba(20,60,40,.10);
    border:1px solid rgba(255,255,255,.9);
  }
  .unit .num{
    font-family:'Frank Ruhl Libre', serif;
    font-weight:900;
    font-size:clamp(22px,6.2vw,33px);
    font-variant-numeric: tabular-nums;
    line-height:1;
  }
  .unit:nth-child(1) .num{ color:var(--green-deep); }
  .unit:nth-child(2) .num{ color:var(--blue-deep); }
  .unit:nth-child(3) .num{ color:var(--sand); }
  .unit:nth-child(4) .num{ color:var(--green-deep); }
  .unit .lbl{
    font-size:10px;
    color:#6b7280;
    letter-spacing:.14em;
    margin-top:5px;
    font-weight:500;
  }

  .route{
    display:flex; align-items:center; gap:8px;
    margin-bottom:16px;
  }
  .route .line{
    flex:1; height:3px; border-radius:99px;
    background:linear-gradient(90deg, var(--blue), var(--green));
    position:relative; overflow:hidden;
  }
  .route .fill{
    position:absolute; inset:0 auto 0 0; width:0%;
    background:linear-gradient(90deg, var(--sand), var(--sand-light));
    border-radius:99px;
    transition:width 1s linear;
  }
  .route .pct{
    font-size:11px; color:#6b7280; font-weight:600; white-space:nowrap;
  }

  .done{
    display:none;
    font-family:'Frank Ruhl Libre', serif;
    font-weight:900;
    font-size:clamp(22px,6vw,30px);
    color:var(--green-deep);
    padding:14px 0;
  }

  .target{
    color:#4b5563;
    font-size:12.5px;
  }
  .target b{ color:var(--ink); font-weight:700; }
</style>
</head>
<body>

<div class="scene">
  <svg viewBox="0 0 1000 1000" preserveAspectRatio="none">
    <!-- distant ridge -->
    <path d="M0,300 C150,230 280,340 420,270 C560,205 640,120 800,150 C900,170 950,230 1000,210 L1000,0 L0,0 Z"
          fill="rgba(255,255,255,0.06)"/>
    <!-- amber trail line linking mountain to lake, echoing the logo -->
    <path d="M60,560 C220,520 260,470 380,455 C520,438 560,500 650,485 C780,465 820,540 940,520"
          fill="none" stroke="#f0c896" stroke-width="4" stroke-linecap="round" opacity="0.55"/>
    <path d="M60,560 C220,520 260,470 380,455 C520,438 560,500 650,485 C780,465 820,540 940,520"
          fill="none" stroke="#d68a3c" stroke-width="2" stroke-linecap="round" opacity="0.8" stroke-dasharray="1 14"/>
  </svg>
</div>

  <div class="card">
    <div class="eyebrow">ספירה לאחור</div>
    <h1>ההרשמה למרוץ שביל כרמל-כנרת<br>תיפתח בעוד:</h1>

    <div class="clock" id="clock">
      <div class="unit"><div class="num" id="dd">00</div><div class="lbl">ימים</div></div>
      <div class="unit"><div class="num" id="hh">00</div><div class="lbl">שעות</div></div>
      <div class="unit"><div class="num" id="mm">00</div><div class="lbl">דקות</div></div>
      <div class="unit"><div class="num" id="ss">00</div><div class="lbl">שניות</div></div>
    </div>

    <div class="route">
      <span class="pct" id="pctLabel">0%</span>
      <div class="line"><div class="fill" id="fill"></div></div>
    </div>

    <div class="done" id="doneMsg">🎉 ההרשמה נפתחה!</div>

    <div class="target">ההרשמה נפתחת ב-<b id="targetLabel"></b></div>
  </div>
</div>

<script>
  const TARGET = new Date("2026-08-22T20:00:00");
  const NOW_REF = new Date("2026-08-14T11:16:10.774940");

  document.getElementById('targetLabel').textContent =
    TARGET.toLocaleDateString('he-IL', { weekday:'long', day:'numeric', month:'long', year:'numeric' }) +
    ' בשעה ' + TARGET.toLocaleTimeString('he-IL', { hour:'2-digit', minute:'2-digit' });

  function pad(n){ return String(n).padStart(2,'0'); }
  const totalSpan = TARGET - NOW_REF;

  function tick(){
    const now = new Date();
    const diff = TARGET - now;

    if(diff <= 0){
      document.getElementById('clock').style.display = 'none';
      document.querySelector('.route').style.display = 'none';
      document.getElementById('doneMsg').style.display = 'block';
      return;
    }

    const elapsed = now - NOW_REF;
    const frac = Math.max(0, Math.min(1, elapsed / totalSpan));
    document.getElementById('fill').style.width = (frac*100) + '%';
    document.getElementById('pctLabel').textContent = Math.round(frac*100) + '%';

    const days = Math.floor(diff / (1000*60*60*24));
    const hours = Math.floor((diff / (1000*60*60)) % 24);
    const mins = Math.floor((diff / (1000*60)) % 60);
    const secs = Math.floor((diff / 1000) % 60);

    document.getElementById('dd').textContent = pad(days);
    document.getElementById('hh').textContent = pad(hours);
    document.getElementById('mm').textContent = pad(mins);
    document.getElementById('ss').textContent = pad(secs);

    setTimeout(tick, 1000);
  }
  tick();
</script>
